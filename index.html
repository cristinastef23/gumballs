<div id="physics-sandbox" style="width: 100%; height: 450px; position: relative; overflow: hidden; border-radius: 12px; background: ffffff;"></div>

<script src="https://cloudflare.com"></script>
<script>
window.addEventListener('load'
                        , function() {
  const container = document.getElementById('physics-sandbox');
  const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;

  const engine = Engine.create();
  const render = Render.create({
    element: container,
    engine: engine,
    options: {
      width: container.clientWidth,
      height: container.clientHeight,
      wireframes: false,
      background: 'transparent'
    }
  });

  // Create floor and invisible walls so objects stay inside
  const w = container.clientWidth;
  const h = container.clientHeight;
  const walls = [
    Bodies.rectangle(w / 2, h + 25, w, 50, { isStatic: true }), // Floor
    Bodies.rectangle(-25, h / 2, 50, h, { isStatic: true }),    // Left wall
    Bodies.rectangle(w + 25, h / 2, 50, h, { isStatic: true })  // Right wall
  ];

  // Add falling objects (Replace colors or add sprite textures)
  const item1 = Bodies.circle(w * 0.3, 50, 35, { restitution: 0.7, render: { sprite: { texture: 'https://apple-alpaca-l9ps.squarespace.com/config/asset-library/file-details/b757d98b-fead-431e-bd63-849b64265dad', xScale: 0.5, yScale: 0.5 } } });
  const item2 = Bodies.rectangle(w * 0.5, 20, 80, 50, { restitution: 0.6, render: { sprite: { texture: 'https://apple-alpaca-l9ps.squarespace.com/config/asset-library/file-details/c25634c3-90af-4ac3-b8cc-fafa3cacfcd7', xScale: 0.5, yScale: 0.5 } });
  const item3 = Bodies.circle(w * 0.7, 80, 40, { restitution: 0.8, render: { sprite: { texture: 'https://apple-alpaca-l9ps.squarespace.com/config/asset-library/file-details/4b9ce2f7-17d1-4981-8a85-22e36b03a38d', xScale: 0.5, yScale: 0.5 } });

  // Enable mouse and touch dragging
  const mouse = Mouse.create(render.canvas);
  const mouseConstraint = MouseConstraint.create(engine, {
    mouse: mouse,
    constraint: { stiffness: 0.2, render: { visible: false } }
  });

  Composite.add(engine.world, [...walls, item1, item2, item3, mouseConstraint]);
  Render.run(render);
  Runner.run(Runner.create(), engine);
});
</script>
