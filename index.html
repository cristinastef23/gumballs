<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #physics-sandbox { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="physics-sandbox"></div>
  <script src="https://cloudflare.com"></script>
  <script>
    const container = document.getElementById('physics-sandbox');
    const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;
    const w = window.innerWidth || 800;
    const h = window.innerHeight || 500;

    const engine = Engine.create();
    const render = Render.create({
      element: container,
      engine: engine,
      options: { width: w, height: h, wireframes: false, background: 'transparent' }
    });

    const walls = [
      Bodies.rectangle(w / 2, h + 25, w, 50, { isStatic: true }),
      Bodies.rectangle(-25, h / 2, 50, h, { isStatic: true }),
      Bodies.rectangle(w + 25, h / 2, 50, h, { isStatic: true })
    ];

    const items = [
      Bodies.circle(w * 0.3, 50, 40, { restitution: 0.75, render: { fillStyle: '#ff6b6b' } }),
      Bodies.rectangle(w * 0.5, 20, 80, 50, { restitution: 0.7, render: { fillStyle: '#4ecdc4' } }),
      Bodies.circle(w * 0.7, 80, 45, { restitution: 0.8, render: { fillStyle: '#ffe66d' } })
    ];

    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse: mouse,
      constraint: { stiffness: 0.2, render: { visible: false } }
    });

    Composite.add(engine.world, [...walls, ...items, mouseConstraint]);
    Render.run(render);
    Runner.run(Runner.create(), engine);
  </script>
</body>
</html>
